<!DOCTYPE html>
<html lang="th" class="dark:bg-[#1e1f20] dark:bg-[#131314]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบฝึกสอบปรนัย (MCQ) - COM-SCI Labs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'Sarabun', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', 'Sarabun', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; }
        
        /* Option Hover & Active Effects */
        .option-btn {
            transition: all 0.2s ease;
        }
        .option-btn:hover:not(:disabled) {
            transform: translateX(4px);
            background-color: rgba(99, 102, 241, 0.05);
            border-color: #6366f1;
        }
        .option-selected {
            background-color: #eef2ff !important;
            border-color: #6366f1 !important;
            color: #4f46e5 !important;
        }
        .dark .option-selected {
            background-color: rgba(99, 102, 241, 0.15) !important;
            border-color: #818cf8 !important;
            color: #a5b4fc !important;
        }
        
        .option-correct {
            background-color: #f0fdf4 !important;
            border-color: #22c55e !important;
            color: #15803d !important;
        }
        .dark .option-correct {
            background-color: rgba(34, 197, 94, 0.15) !important;
            border-color: #4ade80 !important;
            color: #86efac !important;
        }
        
        .option-wrong {
            background-color: #fef2f2 !important;
            border-color: #ef4444 !important;
            color: #b91c1c !important;
        }
        .dark .option-wrong {
            background-color: rgba(239, 68, 68, 0.15) !important;
            border-color: #f87171 !important;
            color: #fca5a5 !important;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-[#131314] text-slate-800 dark:text-slate-200 antialiased selection:bg-indigo-200 selection:text-indigo-900">

    <!-- Sidebar injected via JS -->
    <script src="../assets/js/sidebar.js"></script>
    <script>renderSidebar(window.location.pathname);</script>

    <!-- Main Content Area -->
    <main class="min-h-screen flex flex-col transition-all duration-300">

        <!-- Top Header -->
        <header class="sticky top-0 z-20 bg-white dark:bg-[#1e1f20]/80 dark:bg-[#131314]/80 backdrop-blur-md px-4 py-3 flex items-center justify-between border-b border-slate-100 dark:border-slate-800">
            <button onclick="toggleSidebar()" class="p-2 -ml-2 rounded-full hover:bg-slate-100 dark:bg-[#1e1f20] dark:hover:bg-slate-800 text-slate-600 dark:text-slate-400 dark:text-slate-300">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <span class="font-bold text-slate-800 dark:text-slate-200">COM-SCI Labs</span>
            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-emerald-400 to-cyan-500 text-white flex items-center justify-center font-bold text-sm">U</div>
        </header>

        <!-- Content -->
        <div class="flex-1 p-4 md:p-6 lg:p-8 max-w-4xl mx-auto w-full flex flex-col">
            
            <div class="mb-6">
                <h1 class="text-2xl font-bold flex items-center gap-2 text-indigo-600 dark:text-indigo-400">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    <span>ระบบฝึกสอบปรนัย (MCQ)</span>
                </h1>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">วิชา COS1101 (วิทยาการคอมพิวเตอร์เบื้องต้น)</p>
            </div>

            <!-- Screen 1: Setup -->
            <div id="screen-setup" class="bg-white dark:bg-[#1e1f20] rounded-2xl p-6 shadow-sm border border-slate-100 dark:border-slate-800 flex flex-col gap-6">
                <div>
                    <h3 class="text-lg font-bold mb-3 flex items-center gap-2">
                        <span class="bg-indigo-100 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-400 w-8 h-8 rounded-full flex items-center justify-center text-sm">1</span>
                        เลือกบทเรียน
                    </h3>
                    <div id="chapter-list" class="grid grid-cols-2 md:grid-cols-4 gap-3">
                        <!-- Loaded dynamically -->
                        <div class="col-span-2 md:col-span-4 text-center py-4 text-slate-400 text-sm animate-pulse">กำลังโหลดข้อมูลข้อสอบ...</div>
                    </div>
                </div>

                <div id="count-section" class="hidden">
                    <h3 class="text-lg font-bold mb-3 flex items-center gap-2">
                        <span class="bg-indigo-100 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-400 w-8 h-8 rounded-full flex items-center justify-center text-sm">2</span>
                        จำนวนข้อ
                    </h3>
                    <div id="count-list" class="flex flex-wrap gap-3">
                        <!-- Loaded dynamically -->
                    </div>
                    <div class="mt-6 flex justify-end">
                        <button onclick="startQuiz()" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition-all shadow-md hover:shadow-lg flex items-center gap-2">
                            เริ่มทำข้อสอบ
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Screen 2: Quiz -->
            <div id="screen-quiz" class="hidden flex flex-col gap-4 flex-1">
                <div class="flex items-center justify-between bg-white dark:bg-[#1e1f20] p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800">
                    <div class="font-bold text-slate-700 dark:text-slate-300" id="quiz-progress-text">ข้อ 1 / 10</div>
                    <div class="font-mono font-bold text-lg text-indigo-600 dark:text-indigo-400" id="quiz-timer">00:00</div>
                    <button onclick="endQuizEarly()" class="text-sm text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-900/30 px-3 py-1 rounded-lg transition-colors">จบการทำข้อสอบ</button>
                </div>
                
                <!-- Progress Bar -->
                <div class="w-full bg-slate-200 dark:bg-slate-700 rounded-full h-2">
                    <div id="quiz-progress-bar" class="bg-indigo-600 h-2 rounded-full transition-all duration-300" style="width: 10%"></div>
                </div>

                <div class="bg-white dark:bg-[#1e1f20] rounded-2xl p-6 shadow-sm border border-slate-100 dark:border-slate-800 flex-1 flex flex-col">
                    <h2 id="question-text" class="text-xl font-bold mb-6 text-slate-800 dark:text-slate-100 leading-relaxed">
                        Question goes here
                    </h2>
                    
                    <div id="options-container" class="flex flex-col gap-3 mb-6 flex-1">
                        <!-- Options generated here -->
                    </div>
                    
                    <div id="explanation-box" class="hidden mb-6 p-4 rounded-xl bg-slate-50 dark:bg-[#282a2c] border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 text-sm leading-relaxed">
                        <strong>คำอธิบาย:</strong> <span id="explanation-text"></span>
                    </div>

                    <div class="flex justify-between items-center mt-auto pt-4 border-t border-slate-100 dark:border-slate-800">
                        <button id="btn-prev" onclick="prevQuestion()" class="px-5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 font-medium disabled:opacity-50 disabled:cursor-not-allowed">ย้อนกลับ</button>
                        <button id="btn-next" onclick="nextQuestion()" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-medium disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
                            ข้อถัดไป
                        </button>
                    </div>
                </div>
            </div>

            <!-- Screen 3: Results -->
            <div id="screen-result" class="hidden bg-white dark:bg-[#1e1f20] rounded-2xl p-8 shadow-sm border border-slate-100 dark:border-slate-800 flex flex-col items-center text-center gap-6">
                <div class="w-24 h-24 rounded-full bg-gradient-to-tr from-indigo-500 to-blue-500 flex items-center justify-center text-white mb-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                </div>
                <div>
                    <h2 class="text-3xl font-bold mb-2">ทำข้อสอบเสร็จสิ้น!</h2>
                    <p class="text-slate-500 dark:text-slate-400">สรุปผลคะแนนของคุณ</p>
                </div>
                
                <div class="text-6xl font-black text-indigo-600 dark:text-indigo-400 my-4" id="final-score">
                    15/20
                </div>
                
                <div class="flex gap-4 w-full max-w-md">
                    <button onclick="reviewAnswers()" class="flex-1 py-3 border-2 border-indigo-600 text-indigo-600 dark:text-indigo-400 font-bold rounded-xl hover:bg-indigo-50 dark:hover:bg-indigo-900/30 transition-colors">ทบทวนข้อที่ผิด</button>
                    <button onclick="resetApp()" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md transition-colors">กลับหน้าหลัก</button>
                </div>
            </div>

        </div>
    </main>

    <script src="../assets/js/core.js"></script>
    <!-- We will load mcq_data.js after generating it -->
    <script>
        // Use a placeholder until the subagent writes the file
        let mcqData = {};
        
        // Try loading the data dynamically
        const script = document.createElement('script');
        script.src = '../assets/js/mcq_data.js';
        script.onload = initApp;
        script.onerror = () => {
            console.warn("mcq_data.js not found yet. The subagent might still be writing it.");
            // Render placeholder UI
            const list = document.getElementById('chapter-list');
            list.innerHTML = '<div class="col-span-2 md:col-span-4 text-center py-4 text-orange-500 text-sm">กำลังวิเคราะห์เนื้อหา PDF เพื่อสร้างข้อสอบ... กรุณารอสักครู่แล้วรีเฟรชหน้าเว็บ</div>';
        };
        document.body.appendChild(script);

        // --- App Logic ---
        let selectedChapter = null;
        let selectedCount = 0;
        let activeQuestions = [];
        let currentQIndex = 0;
        let userAnswers = []; // store index of selected option
        let timerInterval;
        let secondsElapsed = 0;
        let isReviewMode = false;

        function initApp() {
            if (typeof mcqData === 'undefined' || Object.keys(mcqData).length === 0) {
                document.getElementById('chapter-list').innerHTML = '<div class="col-span-2 md:col-span-4 text-center py-4 text-orange-500 text-sm">กำลังวิเคราะห์เนื้อหา PDF เพื่อสร้างข้อสอบ... กรุณารอสักครู่แล้วรีเฟรชหน้าเว็บ</div>';
                return;
            }
            
            const list = document.getElementById('chapter-list');
            list.innerHTML = '';
            
            // Build chapter buttons
            Object.keys(mcqData).sort().forEach(ch => {
                const qCount = mcqData[ch].length;
                const btn = document.createElement('button');
                btn.className = `p-4 rounded-xl border-2 border-slate-200 dark:border-slate-700 hover:border-indigo-500 dark:hover:border-indigo-400 hover:bg-indigo-50 dark:hover:bg-indigo-900/20 text-left transition-all`;
                btn.id = `btn-ch-${ch}`;
                btn.innerHTML = `
                    <div class="font-bold text-lg">บทที่ ${ch}</div>
                    <div class="text-xs text-slate-500 dark:text-slate-400 mt-1">มี ${qCount} ข้อ</div>
                `;
                btn.onclick = () => selectChapter(ch);
                list.appendChild(btn);
            });
            
            // Add Random All button
            const totalQuestions = Object.values(mcqData).reduce((sum, arr) => sum + arr.length, 0);
            if (totalQuestions > 0) {
                const btnAll = document.createElement('button');
                btnAll.className = `p-4 rounded-xl border-2 border-slate-200 dark:border-slate-700 hover:border-indigo-500 dark:hover:border-indigo-400 hover:bg-indigo-50 dark:hover:bg-indigo-900/20 text-left transition-all col-span-2 md:col-span-4`;
                btnAll.id = `btn-ch-all`;
                btnAll.innerHTML = `
                    <div class="font-bold text-lg text-indigo-600 dark:text-indigo-400">สุ่มรวมทุกบท (Mock Exam)</div>
                    <div class="text-xs text-slate-500 dark:text-slate-400 mt-1">สุ่มจากคลังทั้งหมด ${totalQuestions} ข้อ</div>
                `;
                btnAll.onclick = () => selectChapter('all');
                list.appendChild(btnAll);
            }
        }

        function selectChapter(ch) {
            selectedChapter = ch;
            // Highlight selected
            document.querySelectorAll('#chapter-list button').forEach(b => {
                b.classList.remove('border-indigo-500', 'dark:border-indigo-400', 'bg-indigo-50', 'dark:bg-indigo-900/20');
            });
            document.getElementById(`btn-ch-${ch}`).classList.add('border-indigo-500', 'dark:border-indigo-400', 'bg-indigo-50', 'dark:bg-indigo-900/20');
            
            // Show count options
            document.getElementById('count-section').classList.remove('hidden');
            const countList = document.getElementById('count-list');
            countList.innerHTML = '';
            
            let total = 0;
            if (ch === 'all') {
                total = Object.values(mcqData).reduce((sum, arr) => sum + arr.length, 0);
            } else {
                total = mcqData[ch].length;
            }
            
            const options = [5, 10, 20, 30, 50, total].filter(x => x <= total);
            if (!options.includes(total)) options.push(total);
            
            // Filter unique
            const uniqueOptions = [...new Set(options)].sort((a,b)=>a-b);
            
            uniqueOptions.forEach((opt, idx) => {
                const b = document.createElement('button');
                b.className = `px-4 py-2 rounded-lg border-2 border-slate-200 dark:border-slate-700 hover:border-indigo-500 text-sm font-bold transition-colors`;
                b.id = `btn-count-${opt}`;
                b.innerText = opt === total && opt > 50 ? 'ทั้งหมด (' + opt + ')' : opt + ' ข้อ';
                b.onclick = () => {
                    selectedCount = opt;
                    document.querySelectorAll('#count-list button').forEach(btn => btn.classList.remove('border-indigo-500', 'bg-indigo-50', 'dark:bg-indigo-900/20', 'text-indigo-600', 'dark:text-indigo-400'));
                    b.classList.add('border-indigo-500', 'bg-indigo-50', 'dark:bg-indigo-900/20', 'text-indigo-600', 'dark:text-indigo-400');
                };
                countList.appendChild(b);
            });
            
            // Auto select first
            if(uniqueOptions.length > 0) {
                countList.children[0].click();
            }
        }

        function startQuiz() {
            if (!selectedChapter || !selectedCount) return;
            
            let pool = [];
            if (selectedChapter === 'all') {
                Object.values(mcqData).forEach(arr => pool = pool.concat(arr));
            } else {
                pool = [...mcqData[selectedChapter]];
            }
            
            // Shuffle and slice
            activeQuestions = pool.sort(() => 0.5 - Math.random()).slice(0, selectedCount);
            userAnswers = new Array(activeQuestions.length).fill(null);
            currentQIndex = 0;
            isReviewMode = false;
            
            document.getElementById('screen-setup').classList.add('hidden');
            document.getElementById('screen-quiz').classList.remove('hidden');
            
            secondsElapsed = 0;
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                secondsElapsed++;
                updateTimerDisplay();
            }, 1000);
            
            renderQuestion();
        }

        function updateTimerDisplay() {
            const m = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
            const s = (secondsElapsed % 60).toString().padStart(2, '0');
            document.getElementById('quiz-timer').innerText = `${m}:${s}`;
        }

        function renderQuestion() {
            const q = activeQuestions[currentQIndex];
            document.getElementById('quiz-progress-text').innerText = `ข้อ ${currentQIndex + 1} / ${activeQuestions.length}`;
            document.getElementById('quiz-progress-bar').style.width = `${((currentQIndex + 1) / activeQuestions.length) * 100}%`;
            
            document.getElementById('question-text').innerText = q.question;
            
            const optContainer = document.getElementById('options-container');
            optContainer.innerHTML = '';
            
            q.options.forEach((optText, idx) => {
                const btn = document.createElement('button');
                btn.className = `option-btn w-full text-left p-4 rounded-xl border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-[#1e1f20] shadow-sm font-medium transition-all flex items-center gap-3`;
                
                const prefix = String.fromCharCode(65 + idx); // A, B, C, D
                
                let stateClass = '';
                if (isReviewMode) {
                    btn.disabled = true;
                    if (idx === q.answer) {
                        stateClass = 'option-correct';
                    } else if (userAnswers[currentQIndex] === idx) {
                        stateClass = 'option-wrong';
                    }
                } else {
                    if (userAnswers[currentQIndex] === idx) {
                        stateClass = 'option-selected';
                    }
                }
                
                if (stateClass) btn.classList.add(...stateClass.split(' '));
                
                btn.innerHTML = `
                    <div class="w-8 h-8 shrink-0 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-sm font-bold text-slate-500">${prefix}</div>
                    <div>${optText}</div>
                `;
                
                if (!isReviewMode) {
                    btn.onclick = () => {
                        userAnswers[currentQIndex] = idx;
                        renderQuestion(); // Re-render to show selection
                    };
                }
                optContainer.appendChild(btn);
            });
            
            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');
            
            btnPrev.disabled = currentQIndex === 0;
            
            if (currentQIndex === activeQuestions.length - 1) {
                if (isReviewMode) {
                    btnNext.innerText = 'เสร็จสิ้นการทบทวน';
                    btnNext.onclick = () => {
                        document.getElementById('screen-quiz').classList.add('hidden');
                        document.getElementById('screen-result').classList.remove('hidden');
                    };
                } else {
                    btnNext.innerText = 'ส่งคำตอบ (Submit)';
                    btnNext.onclick = finishQuiz;
                }
            } else {
                btnNext.innerText = 'ข้อถัดไป';
                btnNext.onclick = nextQuestion;
            }
            
            const expBox = document.getElementById('explanation-box');
            if (isReviewMode && q.explanation) {
                expBox.classList.remove('hidden');
                document.getElementById('explanation-text').innerText = q.explanation;
            } else {
                expBox.classList.add('hidden');
            }
        }

        function nextQuestion() {
            if (currentQIndex < activeQuestions.length - 1) {
                currentQIndex++;
                renderQuestion();
            }
        }

        function prevQuestion() {
            if (currentQIndex > 0) {
                currentQIndex--;
                renderQuestion();
            }
        }

        function finishQuiz() {
            // Check if all answered
            const unanswered = userAnswers.filter(a => a === null).length;
            if (unanswered > 0) {
                if (!confirm(`คุณยังไม่ได้ตอบอีก ${unanswered} ข้อ ต้องการส่งคำตอบเลยหรือไม่?`)) {
                    return;
                }
            }
            endQuizEarly();
        }
        
        function endQuizEarly() {
            clearInterval(timerInterval);
            
            let score = 0;
            userAnswers.forEach((ans, idx) => {
                if (ans === activeQuestions[idx].answer) score++;
            });
            
            document.getElementById('screen-quiz').classList.add('hidden');
            document.getElementById('screen-result').classList.remove('hidden');
            
            document.getElementById('final-score').innerText = `${score} / ${activeQuestions.length}`;
        }
        
        function reviewAnswers() {
            isReviewMode = true;
            currentQIndex = 0;
            document.getElementById('screen-result').classList.add('hidden');
            document.getElementById('screen-quiz').classList.remove('hidden');
            renderQuestion();
        }
        
        function resetApp() {
            document.getElementById('screen-result').classList.add('hidden');
            document.getElementById('screen-quiz').classList.add('hidden');
            document.getElementById('screen-setup').classList.remove('hidden');
        }
    </script>
</body>
</html>
